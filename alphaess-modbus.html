<!--
	AlphaESS Modbus – editor definition.
	All texts come from locales/<language>/alphaess-modbus.json (data-i18n / this._),
	the help texts from locales/<language>/alphaess-modbus.html.
-->

<!-- ======================================================= config node === -->
<script type="text/javascript">
	RED.nodes.registerType('alphaess-modbus-config', {
		category: 'config',
		defaults: {
			name: { value: '' },
			host: { value: '', required: true },
			port: { value: 502, required: true, validate: RED.validators.number() },
			unitId: { value: 85, required: true, validate: RED.validators.number() },
			timeout: { value: 2000, validate: RED.validators.number() },
			delay: { value: 20, validate: RED.validators.number() }
		},
		label: function () {
			return this.name || (this.host ? this.host + ':' + this.port : 'AlphaESS Modbus');
		}
	});
</script>

<script type="text/html" data-template-name="alphaess-modbus-config">
	<div class="form-row">
		<label for="node-config-input-name"><i class="fa fa-tag"></i> <span data-i18n="node-red:common.label.name"></span></label>
		<input type="text" id="node-config-input-name">
	</div>
	<div class="form-row">
		<label for="node-config-input-host"><i class="fa fa-server"></i> <span data-i18n="alphaess-modbus.label.host"></span></label>
		<input type="text" id="node-config-input-host" data-i18n="[placeholder]alphaess-modbus.placeholder.host">
	</div>
	<div class="form-row">
		<label for="node-config-input-port"><i class="fa fa-random"></i> <span data-i18n="alphaess-modbus.label.port"></span></label>
		<input type="text" id="node-config-input-port" style="width:80px">
	</div>
	<div class="form-row">
		<label for="node-config-input-unitId"><i class="fa fa-hashtag"></i> <span data-i18n="alphaess-modbus.label.unitId"></span></label>
		<input type="text" id="node-config-input-unitId" style="width:80px"> <span data-i18n="alphaess-modbus.unit.unitId"></span>
	</div>
	<div class="form-row">
		<label for="node-config-input-timeout"><i class="fa fa-clock-o"></i> <span data-i18n="alphaess-modbus.label.timeout"></span></label>
		<input type="text" id="node-config-input-timeout" style="width:80px"> <span data-i18n="alphaess-modbus.unit.ms"></span>
	</div>
	<div class="form-row">
		<label for="node-config-input-delay"><i class="fa fa-hourglass-half"></i> <span data-i18n="alphaess-modbus.label.delay"></span></label>
		<input type="text" id="node-config-input-delay" style="width:80px"> <span data-i18n="alphaess-modbus.unit.delay"></span>
	</div>
	<div class="form-tips"><span data-i18n="alphaess-modbus.tip.disclaimer"></span></div>
</script>

<!-- ========================================================= main node === -->
<script type="text/javascript">
	(function () {
		/**
		 * Context stores configured in settings.js, as provided to the editor.
		 * RED.settings.context = { default: "memory", stores: ["memory", "file"] }
		 * Without contextStorage in settings.js only the default store exists.
		 */
		function contextStores() {
			var ctx = (RED.settings && RED.settings.context) || {};
			var stores = Array.isArray(ctx.stores) ? ctx.stores.slice() : [];
			return { def: ctx.default || 'memory', stores: stores };
		}

		function fillStoreSelect(_, select, current) {
			var info = contextStores();
			select.empty();
			$('<option>').val('').text(_('alphaess-modbus.store.default', { store: info.def })).appendTo(select);
			info.stores.forEach(function (s) {
				if (s === info.def) return; // already covered by "default"
				$('<option>').val(s).text(s).appendTo(select);
			});
			var known = current === '' || current === undefined || current === 'default' ||
				current === info.def || info.stores.indexOf(current) !== -1;
			if (!known) {
				// keep a value from an older version or another installation visible
				$('<option>').val(current).text(_('alphaess-modbus.store.notConfigured', { store: current })).appendTo(select);
			}
			select.val(current === 'default' || current === info.def ? '' : (current || ''));

			var hint = $('#alphaess-store-hint');
			var update = function () {
				var v = select.val();
				if (v && info.stores.indexOf(v) === -1) {
					hint.text(_('alphaess-modbus.store.missing')).css('color', '#c00').show();
				} else if (info.stores.length <= 1) {
					hint.text(_('alphaess-modbus.store.onlyMemory')).css('color', '').show();
				} else {
					hint.hide();
				}
			};
			select.off('change.alphaess').on('change.alphaess', update);
			update();
		}

		RED.nodes.registerType('alphaess-modbus', {
			category: 'Alpha ESS',
			color: '#79A9E7',
			defaults: {
				name: { value: '' },
				server: { value: '', type: 'alphaess-modbus-config', required: true },
				interval: { value: 15, validate: RED.validators.number() },
				slowInterval: { value: 300, validate: RED.validators.number() },
				staleAfter: { value: 180, validate: RED.validators.number() },
				topic: { value: 'alphaess/modbus' },
				platform: { value: 'EMS3.x' },
				block_grid: { value: true },
				block_pvMeter: { value: false },
				block_battery: { value: true },
				block_inverter: { value: true },
				block_systemRun: { value: true },
				block_systemConfig: { value: true },
				block_timePeriod: { value: true },
				block_dispatch: { value: true },
				block_info: { value: true },
				includePvMeter: { value: false },
				contextStore: { value: '' },
				mqttBroker: { value: '', type: 'mqtt-broker', required: false },
				mqttPrefix: { value: 'alphaess' },
				mqttQos: { value: '0' },
				mqttRetain: { value: false },
				mqttDetails: { value: false },
				allowWrite: { value: false },
				maxPower: { value: '' },
				writeInterval: { value: 10, validate: RED.validators.number() },
				socScale: { value: 0.1, validate: RED.validators.number() }
			},
			inputs: 1,
			outputs: 3,
			outputLabels: function (i) {
				var keys = ['data', 'alarm', 'response'];
				return this._('alphaess-modbus.outputs.' + keys[i]);
			},
			icon: 'font-awesome/fa-bolt',
			label: function () { return this.name || 'AlphaESS Modbus'; },
			paletteLabel: 'AlphaESS Modbus',
			oneditprepare: function () {
				var node = this;
				var _ = function (key, vars) { return node._(key, vars); };
				var toggle = function () {
					var on = $('#node-input-allowWrite').is(':checked');
					$('.alphaess-write-row').toggle(on);
				};
				$('#node-input-allowWrite').on('change', toggle);
				toggle();
				fillStoreSelect(_, $('#node-input-contextStore'), this.contextStore);
			}
		});
	})();
</script>
